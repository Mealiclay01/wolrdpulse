name: Bug Report
description: File a bug report or regression report for WolrdPulse
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with WolrdPulse!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: E.g., Node.js version, OS, MCP Client (Cursor, Claude, Windsurf, custom).
      placeholder: Node 22, macOS 15, Claude Desktop 0.8
    validations:
      required: false
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Call tool 'get_cloud_status' with ...
        2. See error ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
